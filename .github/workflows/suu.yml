name: Retry on API Failure

on:
  workflow_run:
    workflows:
      - "RSS Feed Processor"
      - "RSS Feed Processor BDIT"
      - "RSS Feed Processor BN"
      - "RSS Feed Processor EDIT"
      - "RSS Feed Processor GP"
      - "Sync Curated Feeds"
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  detect-and-retry:
    name: Check for API failure and retry
    runs-on: ubuntu-latest
    timeout-minutes: 50
    if: github.event.workflow_run.run_attempt <= 5

    steps:
      - name: Download run logs
        id: logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID:   ${{ github.event.workflow_run.id }}
          REPO:     ${{ github.repository }}
        run: |
          set -euo pipefail

          http_code=$(curl -sS -o logs.zip -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -L \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/logs")

          if [[ "$http_code" != "200" || ! -s logs.zip ]]; then
            echo "::warning::Log download failed (HTTP $http_code) — skipping failure check"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          unzip -q logs.zip -d logs/
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - name: Detect API failure
        id: detect
        if: steps.logs.outputs.ok == 'true'
        env:
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail

          gemini_fail=false
          mistral_zero=false

          grep -rq "Gemini classification error" logs/ 2>/dev/null && gemini_fail=true || true
          grep -rq "Mistral returned 0 signal"   logs/ 2>/dev/null && mistral_zero=true || true

          wait_minutes=$(( 2 + ATTEMPT ))
          wait_seconds=$(( wait_minutes * 60 ))

          {
            echo "gemini_fail=$gemini_fail"
            echo "mistral_zero=$mistral_zero"
            echo "wait_seconds=$wait_seconds"
            echo "wait_minutes=$wait_minutes"
          } >> "$GITHUB_OUTPUT"

          if [[ "$gemini_fail" == "true" && "$mistral_zero" == "true" ]]; then
            echo "api_failed=true" >> "$GITHUB_OUTPUT"
            {
              echo "### ⚠️ API Failure Detected — Attempt $ATTEMPT of 5"
              echo "| Signal | Status |"
              echo "|---|---|"
              echo "| Gemini 503 | ✅ found |"
              echo "| Mistral 0 signal | ✅ found |"
              echo ""
              echo "Waiting ${wait_minutes} min before retry."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "api_failed=false" >> "$GITHUB_OUTPUT"
            {
              echo "### ✅ No API Failure — Attempt $ATTEMPT"
              echo "| Signal | Status |"
              echo "|---|---|"
              echo "| Gemini 503 | $([ "$gemini_fail" = "true" ] && echo "found" || echo "not found") |"
              echo "| Mistral 0 signal | $([ "$mistral_zero" = "true" ] && echo "found" || echo "not found") |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Wait before retry
        if: steps.detect.outputs.api_failed == 'true'
        run: sleep ${{ steps.detect.outputs.wait_seconds }}

      - name: Trigger re-run
        if: steps.detect.outputs.api_failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID:   ${{ github.event.workflow_run.id }}
          REPO:     ${{ github.repository }}
          ATTEMPT:  ${{ github.event.workflow_run.run_attempt }}
        run: |
          gh api "repos/$REPO/actions/runs/$RUN_ID/rerun" --method POST
          {
            echo "### 🔄 Retry Triggered"
            echo "Re-run dispatched for run \`$RUN_ID\` → attempt $(( ATTEMPT + 1 )) of 6."
          } >> "$GITHUB_STEP_SUMMARY"